<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7b2cbf">
  <title>SoundSprout — Learn Through Music</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <!-- Top Navigation Bar matching Melody Minds layout -->
    <header class="topbar">
      <a class="brand" href="#" aria-label="SoundSprout home">
        <span class="brand-mark" aria-hidden="true">♫</span>
        <span class="brand-text">
          <strong>SOUNDSPROUT</strong>
          <small>LEARN THROUGH MUSIC</small>
        </span>
      </a>

      <div class="top-pills">
        <span class="pill-badge pill-streak" aria-label="Practice streak">🔥 <strong id="streakCount">1d</strong></span>
        <span class="pill-badge pill-stars" aria-label="Stars earned">⭐ <strong id="starsEarned">0</strong></span>
        <span class="pill-badge pill-beats" aria-label="Beats played">🎵 <strong id="beatsCountTop">0/5</strong></span>
        <button class="pill-badge pill-profile" id="profileButton" type="button" aria-label="Open profile">
          🐻 <strong id="headerName">Learner</strong>
        </button>
        <button class="pill-badge pill-level" id="startLevelTest" type="button">
          🌱 <strong id="learnerLevelBadge">Level Check</strong>
        </button>
        <button class="icon-circle-btn" id="parentSettings" type="button" aria-label="Grown-up settings" title="Grown-up settings">⚙️</button>
      </div>
    </header>

    <main>
      <!-- 4x2 Chunky Tile Navigation Grid -->
      <section class="tile-grid" aria-label="Activities and subjects">
        <button class="nav-tile tile-yellow" data-lesson="rhythm" type="button">
          <span class="tile-icon icon-yellow">🥁</span>
          <strong>Rhythm Rangers</strong>
        </button>

        <button class="nav-tile tile-purple" data-lesson="feelings" type="button">
          <span class="tile-icon icon-purple">💛</span>
          <strong>Feelings DJ</strong>
        </button>

        <button class="nav-tile tile-green" data-lesson="saving" type="button">
          <span class="tile-icon icon-green">🪙</span>
          <strong>Save-a-Beat</strong>
        </button>

        <button class="nav-tile tile-blue" id="tileLevelCheck" type="button">
          <span class="tile-icon icon-blue">🚀</span>
          <strong>Level Check</strong>
        </button>

        <button class="nav-tile tile-pink" id="tileXylophone" type="button">
          <span class="tile-icon icon-pink">🎹</span>
          <strong>Xylophone</strong>
        </button>

        <button class="nav-tile tile-coral" id="tileBeatGame" type="button">
          <span class="tile-icon icon-coral">🪘</span>
          <strong>Beat Game</strong>
        </button>

        <button class="nav-tile tile-lavender" id="playWelcomeTune" type="button">
          <span class="tile-icon icon-lavender">🎶</span>
          <strong>Jukebox</strong>
        </button>

        <button class="nav-tile tile-mint" id="viewProgress" type="button">
          <span class="tile-icon icon-mint">🏆</span>
          <strong>My Progress</strong>
        </button>
      </section>

      <!-- Interactive Musical Classroom / Alphabet Soundboard -->
      <section class="classroom-wrapper">
        <div class="classroom-card">
          <div class="classroom-header">
            <div class="classroom-title">
              <span aria-hidden="true">🎹</span>
              <h2>SOUNDSPROUT MUSICAL CLASSROOM · TAP ANY LETTER TO SING &amp; HEAR!</h2>
            </div>
            <div class="now-playing-pill" id="nowPlayingDisplay" aria-live="polite">
              🎵 <span id="phonicsPhrase">A is for Apple</span> 🍎
            </div>
          </div>

          <div class="alphabet-grid" id="alphabetGrid" role="group" aria-label="Musical alphabet buttons">
            <!-- Populated dynamically by app.js -->
          </div>
        </div>
      </section>

      <!-- Expandable / Collapsible Quick-Play & Progress Bar Banner -->
      <section class="banner-section" id="beatGameSection">
        <div class="banner-card banner-green">
          <div class="banner-left">
            <span class="banner-icon">🪘</span>
            <div>
              <h3>QUICK PLAY BEAT STAGE</h3>
              <p id="beatMessage" role="status" aria-live="polite">Listen to the beat, then tap along to earn badges!</p>
            </div>
          </div>
          <div class="banner-controls">
            <div class="beat-orb" id="beatOrb" aria-hidden="true">♪</div>
            <button class="tap-button" id="tapBeat" type="button">TAP!</button>
            <button class="banner-action-btn" id="playBeat" type="button">▶ Hear Beat</button>
          </div>
        </div>
      </section>

      <footer class="footer">
        <span>SoundSprout 🌱</span>
        <span>Practice at your own pace. Every try counts.</span>
        <span class="achievements-inline">
          Badges: <span id="firstStarStatus" title="First Star">🔒</span> <span id="beatBadgeStatus" title="Listening Legend">🔒</span>
        </span>
      </footer>
    </main>
  </div>

  <dialog id="appDialog" class="app-dialog" aria-labelledby="dialogTitle">
    <div class="dialog-top">
      <span class="dialog-sparkle">✦</span>
      <button class="close-dialog" id="closeDialog" type="button" aria-label="Close dialog">×</button>
    </div>
    <div id="dialogBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  
  <script src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"> </script>
  <script src="app.js"></script>
</body>
</html>
